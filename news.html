<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crypto News – NovaTrace</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    /* ── News-specific styles ── */
    .news-hero {
      background: linear-gradient(135deg, #0b0e11 0%, #161a1e 50%, #0b0e11 100%);
      border-bottom: 1px solid var(--border);
      padding: 48px 80px 40px;
    }
    .news-hero-inner { max-width: 1400px; margin: 0 auto; }
    .news-hero h1 { font-size: 32px; font-weight: 900; margin-bottom: 6px; }
    .news-hero p  { color: var(--text2); font-size: 15px; }
    .live-dot { display: inline-block; width: 8px; height: 8px; background: var(--green); border-radius: 50%; margin-right: 6px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.3)} }

    /* Search + Filters */
    .news-controls {
      max-width: 1400px; margin: 0 auto; padding: 28px 80px 0;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .news-search { position: relative; flex: 1; min-width: 240px; }
    .news-search input {
      width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 14px 11px 40px; color: var(--text1); font-size: 14px; outline: none;
    }
    .news-search input:focus { border-color: var(--accent); }
    .news-search i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text2); }
    .news-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .nf-btn {
      padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
      background: var(--bg2); border: 1px solid var(--border); color: var(--text2); cursor: pointer; transition: all .15s;
    }
    .nf-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nf-btn.active { background: rgba(240,185,11,.15); border-color: var(--accent); color: var(--accent); }
    .news-sort { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text1); font-size: 13px; outline: none; cursor: pointer; }

    /* Grid */
    .news-content { max-width: 1400px; margin: 0 auto; padding: 28px 80px 60px; }

    /* Featured */
    .news-featured {
      display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 32px;
    }
    .featured-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; cursor: pointer; transition: all .2s; position: relative;
    }
    .featured-card:hover { border-color: rgba(240,185,11,.4); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,.4); }
    .featured-img { width: 100%; height: 260px; object-fit: cover; background: var(--bg3); }
    .featured-body { padding: 20px; }
    .featured-source { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
    .featured-title { font-size: 18px; font-weight: 800; line-height: 1.4; margin-bottom: 10px; }
    .featured-desc { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .featured-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text3); }

    /* Side stack */
    .featured-side { display: flex; flex-direction: column; gap: 12px; }
    .side-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      display: flex; gap: 14px; padding: 14px; cursor: pointer; transition: all .2s; flex: 1;
    }
    .side-card:hover { border-color: rgba(240,185,11,.4); transform: translateX(3px); }
    .side-img { width: 90px; height: 70px; object-fit: cover; border-radius: 8px; background: var(--bg3); flex-shrink: 0; }
    .side-body { flex: 1; min-width: 0; }
    .side-source { font-size: 10px; color: var(--accent); font-weight: 700; text-transform: uppercase; }
    .side-title { font-size: 13px; font-weight: 700; line-height: 1.4; margin: 4px 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .side-time { font-size: 11px; color: var(--text3); }

    /* News grid */
    .news-section-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .news-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .news-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; cursor: pointer; transition: all .2s;
    }
    .news-card:hover { border-color: rgba(240,185,11,.4); transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
    .nc-img { width: 100%; height: 160px; object-fit: cover; background: var(--bg3); }
    .nc-body { padding: 14px; }
    .nc-cat { font-size: 10px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .nc-title { font-size: 14px; font-weight: 700; line-height: 1.45; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .nc-desc { font-size: 12px; color: var(--text2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px; }
    .nc-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text3); }
    .nc-source { color: var(--text2); font-weight: 600; }

    /* Skeleton loader */
    .skeleton { background: linear-gradient(90deg, var(--bg2) 25%, var(--bg3) 50%, var(--bg2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skel-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .skel-img { width: 100%; height: 160px; }
    .skel-body { padding: 14px; }
    .skel-line { height: 12px; margin-bottom: 8px; border-radius: 4px; }

    /* Load more */
    .load-more-wrap { text-align: center; margin-top: 40px; }
    .btn-load-more {
      background: var(--bg2); border: 1px solid var(--border); color: var(--text1);
      padding: 12px 36px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s;
    }
    .btn-load-more:hover { border-color: var(--accent); color: var(--accent); }

    /* Modal */
    .news-modal { position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
    .news-modal.open { display: flex; }
    .nm-inner {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 18px;
      width: 100%; max-width: 760px; overflow: hidden; position: relative;
      margin: auto;
    }
    .nm-hero-img { width: 100%; height: 340px; object-fit: cover; background: var(--bg3); }
    .nm-body { padding: 32px; }
    .nm-cats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .nm-cat-tag { background: rgba(240,185,11,.12); color: var(--accent); border: 1px solid rgba(240,185,11,.25); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .nm-title { font-size: 24px; font-weight: 900; line-height: 1.35; margin-bottom: 12px; }
    .nm-meta { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text2); margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .nm-source-logo { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; }
    .nm-body-text { font-size: 15px; line-height: 1.75; color: var(--text2); white-space: pre-wrap; }
    .nm-close { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,.5); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .nm-close:hover { background: rgba(0,0,0,.8); }
    .nm-footer { padding: 20px 32px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .nm-open-link { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #000; padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 13px; text-decoration: none; transition: opacity .15s; }
    .nm-open-link:hover { opacity: .9; }

    /* Tags */
    .cat-tag { display: inline-block; background: rgba(240,185,11,.08); border: 1px solid rgba(240,185,11,.15); color: var(--accent); padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; margin-right: 4px; }

    /* No results */
    .no-results { text-align: center; padding: 80px 20px; color: var(--text2); }
    .no-results i { font-size: 48px; display: block; margin-bottom: 16px; opacity: .3; }

    /* Responsive */
    @media (max-width: 1200px) { .news-grid { grid-template-columns: repeat(3,1fr); } .news-featured { grid-template-columns: 1fr; } .featured-side { flex-direction: row; } }
    @media (max-width: 900px)  { .news-grid { grid-template-columns: repeat(2,1fr); } .news-hero { padding: 32px 20px; } .news-content { padding: 20px; } .news-controls { padding: 20px 20px 0; } }
    @media (max-width: 600px)  { .news-grid { grid-template-columns: 1fr; } .featured-side { flex-direction: column; } }
  </style>
</head>

<div class="ticker-bar"><div class="ticker-track" id="tickerTrack"></div></div>

<!-- Hero -->

    <h1><i class="fa fa-newspaper" style="color:var(--accent);margin-right:12px"></i>Crypto News</h1>

<script>
// ══════════════════════════════════════════════
//   NovaTrace News — Real crypto news via CryptoCompare API
// ══════════════════════════════════════════════

let allNews     = [];
let displayed   = [];
let activeFilter = 'all';
let pageSize    = 20;
let shownCount  = pageSize;

const PLACEHOLDER_IMGS = [
  'https://images.unsplash.com/photo-1621761191319-c6fb62004040?w=600&q=80',
  'https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=600&q=80',
  'https://images.unsplash.com/photo-1642790106117-e829e14a795f?w=600&q=80',
  'https://images.unsplash.com/photo-1518546305927-5a555bb7020d?w=600&q=80',
  'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=600&q=80',
  'https://images.unsplash.com/photo-1590283603385-17ffb3a7f29f?w=600&q=80',
  'https://images.unsplash.com/photo-1607863680198-23d4b2565df0?w=600&q=80',
  'https://images.unsplash.com/photo-1622630998477-20aa696ecb05?w=600&q=80',
];

function getPlaceholder(id) {
  return PLACEHOLDER_IMGS[id % PLACEHOLDER_IMGS.length];
}

function timeAgo(ts) {
  const diff = Math.floor(Date.now()/1000) - ts;
  if (diff < 60)   return diff + 's ago';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400)return Math.floor(diff/3600) + 'h ago';
  return Math.floor(diff/86400) + 'd ago';
}

function formatDate(ts) {
  return new Date(ts * 1000).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function getCategories(article) {
  const cats = (article.categories || '').split('|').filter(Boolean).slice(0, 3);
  return cats.length ? cats : ['Crypto'];
}

function imgSrc(article) {
  return article.imageurl && article.imageurl.startsWith('http')
    ? article.imageurl
    : getPlaceholder(article.id || 0);
}

// ── Fetch news via our own server proxy ───────
async function fetchNews() {
  showSkeletons();
  try {
    const r = await fetch('/api/news');
    if (!r.ok) throw new Error('Server returned ' + r.status);
    const data = await r.json();
    allNews = data.Data || [];
    if (!allNews.length) throw new Error('No articles returned');
    sortAndRender();
  } catch(e) {
    document.getElementById('featuredSection').innerHTML = '';
    document.getElementById('newsGrid').innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text2)">
        <i class="fa fa-triangle-exclamation" style="font-size:40px;display:block;margin-bottom:16px;color:var(--red)"></i>
        Could not load news. Make sure the NovaTrace server is running and refresh.
      </div>`;
  }
}

// ── Filter + Sort + Render ───────────────────
function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.nf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('newsSearch').value = '';
  shownCount = pageSize;
  sortAndRender();
}

function filterNews() {
  shownCount = pageSize;
  sortAndRender();
}

function sortAndRender() {
  const q      = (document.getElementById('newsSearch').value || '').toLowerCase();
  const sort   = document.getElementById('newsSort').value;
  const filter = activeFilter;

  let news = [...allNews];

  // Category filter
  if (filter !== 'all') {
    news = news.filter(a =>
      (a.categories || '').toLowerCase().includes(filter.toLowerCase()) ||
      (a.title || '').toLowerCase().includes(filter.toLowerCase())
    );
  }

  // Search filter
  if (q) {
    news = news.filter(a =>
      (a.title || '').toLowerCase().includes(q) ||
      (a.body || '').toLowerCase().includes(q) ||
      (a.source || '').toLowerCase().includes(q)
    );
  }

  // Sort
  if (sort === 'popular') {
    news = news.sort((a,b) => (b.votes?.positive||0) - (a.votes?.positive||0));
  } else {
    news = news.sort((a,b) => b.published_on - a.published_on);
  }

  displayed = news;

  const countEl = document.getElementById('newsCount');
  countEl.textContent = `— ${news.length} articles`;

  renderFeatured(news.slice(0, 4));
  renderGrid(news.slice(4, 4 + shownCount));

  const loadBtn = document.getElementById('loadMoreWrap');
  loadBtn.style.display = (4 + shownCount) < news.length ? '' : 'none';
}

function loadMore() {
  shownCount += pageSize;
  renderGrid(displayed.slice(4, 4 + shownCount));
  const loadBtn = document.getElementById('loadMoreWrap');
  loadBtn.style.display = (4 + shownCount) < displayed.length ? '' : 'none';
}

// ── Render Featured ──────────────────────────
function renderFeatured(articles) {
  const el = document.getElementById('featuredSection');
  if (!articles.length) { el.innerHTML = ''; return; }

  const main = articles[0];
  const side = articles.slice(1, 4);

  el.innerHTML = `
    <div class="news-featured">
      <div class="featured-card" onclick="openArticle(${main.id})">
        <img class="featured-img" src="${imgSrc(main)}" alt="" onerror="this.src='${getPlaceholder(0)}'"/>
        <div class="featured-body">
          <div class="featured-source">${main.source_info?.name || main.source || 'News'}</div>
          <div class="featured-title">${escHtml(main.title)}</div>
          <div class="featured-desc">${escHtml(main.body?.slice(0,200) || '')}</div>
          <div class="featured-meta">
            ${getCategories(main).map(c=>`<span class="cat-tag">${c}</span>`).join('')}
            <span style="margin-left:auto">${timeAgo(main.published_on)}</span>
          </div>
        </div>
      </div>
      <div class="featured-side">
        ${side.map(a => `
          <div class="side-card" onclick="openArticle(${a.id})">
            <img class="side-img" src="${imgSrc(a)}" alt="" onerror="this.src='${getPlaceholder(a.id||1)}'"/>
            <div class="side-body">
              <div class="side-source">${a.source_info?.name || a.source || 'News'}</div>
              <div class="side-title">${escHtml(a.title)}</div>
              <div class="side-time">${timeAgo(a.published_on)}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
}

// ── Render Grid ──────────────────────────────
function renderGrid(articles) {
  const grid = document.getElementById('newsGrid');
  if (!articles.length) {
    grid.innerHTML = `<div class="no-results" style="grid-column:1/-1">
      <i class="fa fa-newspaper"></i>
      No articles found. Try a different search or filter.
    </div>`;
    return;
  }
  grid.innerHTML = articles.map(a => `
    <div class="news-card" onclick="openArticle(${a.id})">
      <img class="nc-img" src="${imgSrc(a)}" alt="" loading="lazy" onerror="this.src='${getPlaceholder(a.id||0)}'"/>
      <div class="nc-body">
        <div class="nc-cat">${getCategories(a)[0]}</div>
        <div class="nc-title">${escHtml(a.title)}</div>
        <div class="nc-desc">${escHtml(a.body?.slice(0,120) || '')}…</div>
        <div class="nc-meta">
          <span class="nc-source"><i class="fa fa-newspaper" style="font-size:10px;margin-right:3px"></i>${a.source_info?.name || a.source || 'News'}</span>
          <span>${timeAgo(a.published_on)}</span>
        </div>
      </div>
    </div>`).join('');
}

// ── Skeleton loaders ─────────────────────────
function showSkeletons() {
  document.getElementById('featuredSection').innerHTML = `
    <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:32px">
      <div class="skel-card"><div class="skeleton skel-img" style="height:260px"></div>
        <div class="skel-body"><div class="skeleton skel-line" style="width:60%"></div><div class="skeleton skel-line"></div><div class="skeleton skel-line" style="width:80%"></div></div></div>
      <div style="display:flex;flex-direction:column;gap:12px">
        ${[1,2,3].map(()=>`<div class="skel-card" style="flex:1;display:flex;gap:14px;padding:14px"><div class="skeleton" style="width:90px;height:70px;border-radius:8px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton skel-line" style="width:40%"></div><div class="skeleton skel-line"></div></div></div>`).join('')}
      </div>
    </div>`;
  document.getElementById('newsGrid').innerHTML = Array.from({length:8}).map(()=>`
    <div class="skel-card">
      <div class="skeleton skel-img"></div>
      <div class="skel-body">
        <div class="skeleton skel-line" style="width:40%;margin-bottom:8px"></div>
        <div class="skeleton skel-line"></div>
        <div class="skeleton skel-line" style="width:85%"></div>
        <div class="skeleton skel-line" style="width:60%"></div>
      </div>
    </div>`).join('');
}

// ── Article Detail Modal ─────────────────────
function openArticle(id) {
  const a = allNews.find(n => n.id === id);
  if (!a) return;

  document.getElementById('nm-img').src       = imgSrc(a);
  document.getElementById('nm-img').style.display = '';
  document.getElementById('nm-title').textContent = a.title || '';
  document.getElementById('nm-body').textContent  = a.body  || '';
  document.getElementById('nm-src-name').textContent = a.source_info?.name || a.source || '';
  document.getElementById('nm-src-logo').src = a.source_info?.img || '';
  document.getElementById('nm-time').textContent = formatDate(a.published_on);
  document.getElementById('nm-link').href = a.url || '#';

  const cats = getCategories(a);
  document.getElementById('nm-cats').innerHTML = cats.map(c =>
    `<span class="nm-cat-tag">${c}</span>`).join('');

  document.getElementById('newsModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeNewsModal() {
  document.getElementById('newsModal').classList.remove('open');
  document.body.style.overflow = '';
}

function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Close modal on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNewsModal(); });

// ── Init ─────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildTicker();
  updateNavForUser();
  connectBinanceWS();
  fetchNews();
});
</script>
</body>
